<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Detect system dark mode preference and apply it before first paint -->
    <script>
        (function () {
            const appearance = localStorage.getItem('appearance') || 'system';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (appearance === 'dark' || (appearance === 'system' && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <style>
        html {
            background-color: oklch(1 0 0);
        }

        html.dark {
            background-color: oklch(0.145 0 0);
        }
    </style>

    <title>CTK Incorporated</title>
    <meta name="description" content="CTK Incorporated builds, leases, and services NIJ Level 4 armored vehicles in the Philippines.">

    <link rel="icon" href="/ctkico.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600|bricolage-grotesque:500,600,700" rel="stylesheet" />

    <script type="module" src="/resources/js/static.jsx"></script>
</head>

<body class="font-sans antialiased">
    <div id="app"></div>
</body>

</html>
